name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6

      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Install Gitleaks
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$(go env GOPATH)/bin/gitleaks"

      - name: Show tool versions
        run: |
          go version
          buf --version
          protoc-gen-go --version
          goose -version
          govulncheck -version
          make --version
          gitleaks version

      - name: Verify Kubernetes manifests
        shell: bash
        run: |
          kubectl version --client
          kubectl kustomize deploy/k8s/base > /tmp/variable-star-k8s.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/variable-star-k8s.yaml > /dev/null

      - name: Run vulnerability scan
        run: govulncheck ./...

      - name: Verify Gitleaks detection
        shell: bash
        run: |
          self_test_file="$(mktemp)"
          trap 'rm -f "$self_test_file"' EXIT
          printf 'token = "%s%s%s"\n' 'ghp_' 'aBcDeFgHiJkLmNoPqRs' 'TuVwXyZ0123456789' > "$self_test_file"

          set +e
          gitleaks detect --no-git --source "$self_test_file" --no-banner --redact
          rc=$?
          set -e

          if [ "$rc" -ne 1 ]; then
            echo "Gitleaks self-test failed: expected exit 1, got $rc"
            exit 1
          fi

      - name: Run secret scan
        run: gitleaks detect --source . --no-banner --redact --verbose --gitleaks-ignore-path .gitleaksignore --log-opts="--all"

      - name: Run quality gate
        run: make ci

      - name: Verify clean repository
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"