name: Publish Go Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: candidate-orchestrator
            image: ghcr.io/zchen470/variable-star-candidate-orchestrator
          - target: classifier-worker
            image: ghcr.io/zchen470/variable-star-classifier-worker
          - target: async-classifier-worker
            image: ghcr.io/zchen470/variable-star-async-classifier-worker
          - target: classification-result-writer
            image: ghcr.io/zchen470/variable-star-classification-result-writer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/go-service.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            TARGET=${{ matrix.target }}
            GOPROXY=https://proxy.golang.org,direct
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record digest
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "image=${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
