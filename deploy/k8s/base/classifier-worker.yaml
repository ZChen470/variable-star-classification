apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-worker
  namespace: variable-star
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: classifier-worker
  template:
    metadata:
      labels:
        app: classifier-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: classifier-worker
          image: ghcr.io/zchen470/variable-star-async-classifier-worker@sha256:c1c381d494c7bc50fa1915a21b684e4856cfb3b2612eca4b25147e77020daa02
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
              memory: "64Mi"
            limits:
              cpu: "2"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: classifier-worker-config
            - secretRef:
                name: classifier-worker-secret
          ports:
            - name: management
              containerPort: 9091
          volumeMounts:
            - name: serving-manifest
              mountPath: /config/model-bundle-manifest-v2.yaml
              subPath: model-bundle-manifest-v2.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /live
              port: management
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: serving-manifest
          configMap:
            name: classifier-worker-serving-manifest
            defaultMode: 0444
