apiVersion: v1
kind: ServiceAccount
metadata:
  name: triton-gateway-discovery
  namespace: variable-star
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triton-gateway-discovery
  namespace: variable-star
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triton-gateway-discovery
  namespace: variable-star
subjects:
  - kind: ServiceAccount
    name: triton-gateway-discovery
    namespace: variable-star
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: triton-gateway-discovery
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triton-gateway-inference
  namespace: variable-star
  annotations:
    kubernetes.io/ingress.class: triton-gateway
    traefik.ingress.kubernetes.io/router.entrypoints: inference
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: variable-star-triton
                port:
                  name: http
