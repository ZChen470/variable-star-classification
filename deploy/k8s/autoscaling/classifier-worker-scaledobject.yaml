apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: classifier-worker
  namespace: variable-star
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: classifier-worker

  minReplicaCount: 2
  maxReplicaCount: 3

  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: classifier-worker-keda-hpa
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 120
          selectPolicy: Max
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

        # The exporter refreshes every 15 seconds. A snapshot older than
        # 45 seconds, a failed refresh, or missing health metadata is
        # treated as unhealthy. In that case fail open to capacity:
        # 15 / AverageValue(5) = 3 replicas, which is maxReplicaCount.
        query: >-
          (
            (
              sum(
                astro_kafka_consumer_group_lag{
                  group="light-curve-classification-command-group",
                  topic="light-curve-classification-command"
                }
              )
            )
            and on()
            (
              astro_kafka_consumer_group_snapshot_success{
                group="light-curve-classification-command-group",
                topic="light-curve-classification-command"
              } == 1
            )
            and on()
            (
              (
                time()
                -
                astro_kafka_consumer_group_snapshot_timestamp_seconds{
                  group="light-curve-classification-command-group",
                  topic="light-curve-classification-command"
                }
              ) < 45
            )
          )
          or vector(15)
        threshold: "5"
        ignoreNullValues: "false"
        timeout: "3s"

    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

        # Healthy snapshots preserve the age>30s insurance trigger.
        # An unhealthy or stale snapshot returns 1 instead of stale/zero
        # data, keeping the autoscaler biased toward available capacity.
        query: >-
          (
            (
              max(
                astro_kafka_consumer_group_oldest_uncommitted_age_seconds{
                  group="light-curve-classification-command-group",
                  topic="light-curve-classification-command"
                }
              ) > bool 30
            )
            and on()
            (
              astro_kafka_consumer_group_snapshot_success{
                group="light-curve-classification-command-group",
                topic="light-curve-classification-command"
              } == 1
            )
            and on()
            (
              (
                time()
                -
                astro_kafka_consumer_group_snapshot_timestamp_seconds{
                  group="light-curve-classification-command-group",
                  topic="light-curve-classification-command"
                }
              ) < 45
            )
          )
          or vector(1)
        threshold: "0.5"
        ignoreNullValues: "false"
        timeout: "3s"
