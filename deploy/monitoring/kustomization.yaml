apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - podmonitor-variable-star-applications.yaml

configMapGenerator:
  - name: grafana-dashboard-application-operations
    namespace: monitoring
    files:
      - application-operations.json=dashboards/application-operations.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-kafka-retry-dlq
    namespace: monitoring
    files:
      - kafka-retry-dlq.json=dashboards/kafka-retry-dlq.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
